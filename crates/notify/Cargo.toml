[package]
name = "skym-notify"
description = "skym-notify: tells a Feishu group about skym's problems, and pings healthchecks.io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "skym-notify"
path = "src/main.rs"

[dependencies]
skym-core = { path = "../core" }
anyhow = "1"
base64 = "0.22"
hmac = "0.12"
jiff.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["rt", "macros", "time", "signal"] }
toml = "1"

[dev-dependencies]
skym-core = { path = "../core", features = ["fixtures"] }
axum = "0.8"
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }

[lints]
workspace = true
