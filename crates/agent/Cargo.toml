[package]
name = "skym-agent"
description = "skym: host and container checks, run on every monitored host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "skym"
path = "src/main.rs"

[dependencies]
skym-core = { path = "../core" }
anyhow = "1"
bollard = { version = "0.21", default-features = false, features = ["pipe"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
jiff.workspace = true
regex = "1"
rustix = { version = "1", features = ["fs"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["rt", "macros", "net", "time", "process", "io-util"] }
tokio-postgres = "0.7"
toml = "1"

[lints]
workspace = true
