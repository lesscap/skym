name: release

# A v* tag builds and publishes a release; a manual run only builds (to check the build).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install # the one pinned in rust-toolchain.toml, with its targets
      - run: pip install cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
      - name: Build static binaries
        run: |
          mkdir dist
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo zigbuild --release --locked -p skym-agent -p skym-server --target "$target"
            arch="${target%%-*}"
            cp "target/$target/release/skym" "dist/skym-linux-$arch"
            cp "target/$target/release/skym-server" "dist/skym-server-linux-$arch"
          done
          cp deploy/skym.service deploy/Dockerfile dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: skym-${{ github.ref_name }}
          path: dist/
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
