# Error message wording is not behavior worth pinning down with tests.
exclude_re = [
    "impl fmt::Display for (SubjectError|SinceError|ReportError)",
    # Reads of the real system, verified on real hosts rather than by unit tests:
    "host.rs.*replace hostname ->",
    "systemd.rs.*replace (collect|show) ->",
    "datastore.rs.*replace query_lag ->",
    "logs.rs.*(in|replace) read(_one|_tail)?\\b",
    # Background loops of the server; what they call (heartbeat_once, maintain) is tested.
    "tasks.rs.*\\bspawn(_probes)?\\b",
    # The agent's tick loop and signals; each pass is tested against a real server.
    "agent.rs.*(in|replace) run\\b",
    # Not covered by the tests, which run without Docker (no log lines) and, on macOS, without
    # /proc (no facts): the facts reset after an unsent report and the fallback log start.
    "agent.rs.*(delete ! in|replace - with \\+ in) Agent<'a>::pass",
    # Message wording: the "waiting" count.
    "agent.rs.*replace - with \\+ in Agent<'a>::flush",
    # skym-view's HTTP calls; their paths are tested.
    "view/src/api.rs.*(in|replace) (Client::|install_tls|chain)",
    "systemd.rs.* in collect\\b",
    # Equivalent: the rank ends with the container id, so `>` and `>=` differ only for the same container.
    "containers.rs.*replace > with >= in winners",
    # Equivalent: `<` and `<=` differ only for an identical (length, path), which yields the same mount.
    "host.rs.*replace < with <= in real_mounts",
]
# I/O wiring against Docker, /proc and the network; test support.
exclude_globs = [
    "crates/core/src/fixtures.rs",
    "crates/server/src/main.rs",
    "crates/agent/src/main.rs",
    "crates/agent/src/commands.rs",
    "crates/agent/src/collect/mod.rs",
    "crates/agent/src/collect/docker.rs",
    # HTTP delivery and doctor's checks: verified end to end against a server.
    "crates/agent/src/deliver.rs",
    "crates/agent/src/doctor.rs",
    # skym-view: drawing and the terminal loop are checked by eye against a real server;
    # what they show is decided in problems.rs and app.rs, which are tested.
    "crates/view/src/main.rs",
    "crates/view/src/ui/*.rs",
]
