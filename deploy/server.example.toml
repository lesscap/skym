listen = "0.0.0.0:7280"          # behind a reverse proxy that terminates TLS
database = "/data/skym.db"
report_interval = "60s"

[[customers]]
id = "acme"
name = "Acme"

# `skym-server token` prints a new token and the hash to put here.
[[hosts]]
id = "web-1"
customer = "acme"
token_sha256 = "<64 hex characters>"

[[readers]]
name = "ops-agent"
token_sha256 = "<64 hex characters>"

# Applications you care about: described, probed, and reported missing when they disappear.
[[apps]]
id = "web-1/shop"               # <host>/<project>, <host>/-/<container> or <host>/_systemd/<unit>
name = "Shop"
env = "prod"
note = "The web shop"

[[apps.probes]]
url = "https://shop.example.com/healthz"
# headers = { Authorization = "Bearer <probe token>" }

# URLs that belong to no application, probed once per report interval. By default any status below 400 is up.
[[endpoints]]
url = "https://shop.example.com/"
customer = "acme"

# A URL that answers 401 without a token is up when it does.
[[endpoints]]
url = "https://admin.example.com/"
customer = "acme"
expect = [401]

# A probe URL that wants a token. Header values are secrets: keep this file private (0600).
[[endpoints]]
url = "https://api.example.com/healthz"
customer = "acme"
headers = { Authorization = "Bearer <probe token>" }
