# /etc/skym/config.toml
server = "https://skym.example.com"
token_file = "/etc/skym/token"       # mode 0600, owned by skym
state_dir = "/var/lib/skym"          # created by systemd (StateDirectory=skym)
interval = "60s"

[docker]
enabled = true
exclude = []

# [[docker.blue_green]]              # blue/green releases: a stopped slot is a standby
# projects = ["shop", "shop-green"]  # while the other project runs the same service
# services = ["web", "edge"]

# [[docker.workloads]]               # a datastore image skym does not recognise
# project = "infra"
# service = "database"
# datastore = "postgres"

# [[docker.workloads]]               # Caddy request errors of retired sites are not exceptions
# project = "proxy"
# service = "caddy"
# ignore_caddy_hosts = ["retired.example.com"]

# [[systemd]]                        # services that do not run in Docker
# unit = "xray"
# ports = [443]
